[project]
name = "twitch-bot"
version = "0.1.0"
description = "Twitch chat bot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asqlite>=2.0.0",
    "python-dotenv>=1.2.4",
    "twitchio>=3.3.2",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
